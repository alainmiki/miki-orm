name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.14, 3.15, 3.16]
        scenario: [sqlite-sync, postgres-sync, postgres-async]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: uv install

      - name: Lint
        run: uv run lint

      - name: Run tests
        run: |
          if [ "${{ matrix.scenario }}" = "sqlite-sync" ]; then
            uv run test:sqlite
          elif [ "${{ matrix.scenario }}" = "postgres-sync" ]; then
            uv run test:postgres-sync
          else
            uv run test:postgres-async
          fi

      - name: Build docs
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: uv run docs
