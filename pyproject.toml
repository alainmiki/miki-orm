[project]
name = "miki-orm"
version = "0.1.0"
description = "Universal Django-style ORM for Python with SQLite, PostgreSQL, and MySQL support."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg2-binary>=2.9,<3.0",
    "pymysql>=1.0,<2.0",
    "aiosqlite>=0.18,<0.19",
    "asyncpg>=0.29,<0.31",
    "aiomysql>=0.1,<0.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.1",
    "typing_extensions>=4.8",
]
optional-dependencies = { dev = ["pytest>=8.0", "pytest-asyncio>=0.22", "mkdocs>=1.5", "ruff>=0.0", "black>=24.3", "uv>=2.0"] }

[tool.setuptools.packages.find]
include = ["mikiorm*"]

[project.urls]
Documentation = "https://example.com/docs"
Homepage = "https://example.com"
Repository = "https://github.com/your-org/miki-orm"

[tool.ruff]
line-length = 88
target-version = ["py314"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["mikiorm/test"]
